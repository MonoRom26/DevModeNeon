name: Build DevMode Neon
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project DevModeNeon.xcodeproj \
            -scheme DevModeNeon \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.neonx.devmode \
            build
      - name: Package app payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release-iphoneos/DevModeNeon.app' -print -quit)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r DevModeNeon-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DevModeNeon-unsigned-IPA
          path: DevModeNeon-unsigned.ipa
